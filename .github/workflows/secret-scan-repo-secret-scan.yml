# repo-secret-scan (https://github.com/ickc/repo-secret-scan): gitleaks + trufflehog with triage.
# Push / PR: only the new commits. Schedule / manual: full history.
name: secret-scan-repo-secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload (public repositories)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install repo-secret-scan
        run: |
          pip install "repo-secret-scan @ git+https://github.com/ickc/repo-secret-scan@4211477535fb90f3b3f273c58105425f341bb02f"
          repo-secret-scan tools install

      - name: Choose scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "args=--scope range --base $PR_BASE --head $PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            echo "args=--scope range --base $PUSH_BEFORE --head $SHA" >> "$GITHUB_OUTPUT"
          else
            echo "args=--scope history" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        run: repo-secret-scan scan . ${{ steps.scope.outputs.args }} --out secret-scan --format github-annotations --fail-on high

      - name: Job summary
        if: always()
        run: cat secret-scan/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload SARIF
        if: always() && hashFiles('secret-scan/results.sarif') != '' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: secret-scan/results.sarif
          category: repo-secret-scan
